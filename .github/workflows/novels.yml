name: novel-batch

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Run a model and repository-secret probe without writing novel files"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [novel_tick]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: novel-${{ github.repository }}-writer
  cancel-in-progress: false

env:
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  NOVEL_MODEL: opencode/space-bunny-free
  NOVEL_FALLBACK_MODELS: opencode/muse-spark-1.3-contributor-free,opencode/muse-spark-1.2-contributor-free,opencode/nemotron-3-ultra-free,opencode/nemotron-3.5-lightning-free,opencode/mimo-v2.6-flash-free,opencode/ling-3.0-flash-fin-free

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash
      - name: Record available models
        run: opencode models | tee logs/models.log
      - name: Probe model and repository secret
        if: ${{ inputs.probe == true }}
        run: |
          set -euo pipefail
          probe_log="logs/model-probe.log"
          : > "$probe_log"
          for model in opencode/space-bunny-free opencode/muse-spark-1.3-contributor-free opencode/muse-spark-1.2-contributor-free opencode/nemotron-3-ultra-free opencode/nemotron-3.5-lightning-free opencode/mimo-v2.6-flash-free opencode/ling-3.0-flash-fin-free; do
            if opencode run --model "$model" --agent novel-reviewer "Do not edit files. Reply with exactly NOVEL_MODEL_PROBE_OK and the model name." >> "$probe_log" 2>&1 && grep -q "NOVEL_MODEL_PROBE_OK" "$probe_log"; then
              echo "MODEL_PROBE_OK $model"
              exit 0
            fi
          done
          echo "MODEL_PROBE_FAILED"
          cat "$probe_log"
          exit 1
      - name: Run next novel batch
        if: ${{ inputs.probe != true }}
        run: bash scripts/novel_runner.sh
