name: novel-batch

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Run a model and repository-secret probe without writing novel files"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [novel_tick]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: novel-${{ github.repository }}-writer
  cancel-in-progress: false

env:
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  DISABLE_DIRECT_DISPATCH: "1"
  NOVEL_MODEL: opencode/space-bunny-free
  NOVEL_FALLBACK_MODELS: opencode/muse-spark-1.3-contributor-free,opencode/muse-spark-1.2-contributor-free,opencode/nemotron-3-ultra-free,opencode/nemotron-3.5-lightning-free,opencode/mimo-v2.6-flash-free,opencode/ling-3.0-flash-fin-free

jobs:
  probe:
    if: ${{ inputs.probe == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash
      - name: Create logs directory
        run: mkdir -p logs
      - name: Check repository secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENCODE_API_KEY:-}" ] || [ "$OPENCODE_API_KEY" = "***" ] || [ "${#OPENCODE_API_KEY}" -lt 10 ]; then
            echo "OPENCODE_API_KEY is missing, masked, or too short"
            exit 1
          fi
          echo "OPENCODE_API_KEY is present"
      - name: Probe models
        shell: bash
        run: |
          set -euo pipefail
          probe_log="logs/model-probe.log"
          : > "$probe_log"
          for model in opencode/space-bunny-free opencode/muse-spark-1.3-contributor-free opencode/muse-spark-1.2-contributor-free opencode/nemotron-3-ultra-free opencode/nemotron-3.5-lightning-free opencode/mimo-v2.6-flash-free opencode/ling-3.0-flash-fin-free; do
            safe_name="${model//\//_}"
            if timeout 90s opencode run --model "$model" --agent novel-reviewer "Do not edit files. Reply with exactly NOVEL_MODEL_PROBE_OK and the model name." > "logs/probe-${safe_name}.log" 2>&1 && grep -q "NOVEL_MODEL_PROBE_OK" "logs/probe-${safe_name}.log"; then
              echo "MODEL_PROBE_OK $model"
              exit 0
            fi
            echo "MODEL_PROBE_FAILED $model"
          done
          echo "MODEL_PROBE_FAILED_ALL"
          cat "$probe_log"
          exit 1

  run-batch:
    if: ${{ inputs.probe != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash
      - name: Create logs directory
        run: mkdir -p logs
      - name: Record available models
        run: opencode models | tee logs/models.log
      - name: Run next novel batch
        run: bash scripts/novel_runner.sh

  retrigger:
    needs: run-batch
    if: ${{ always() && needs.run-batch.result != 'cancelled' && needs.run-batch.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check phase state
        id: phase
        run: |
          set -euo pipefail
          exists=false
          has_done=false
          has_blocked=false
          while IFS= read -r prompt; do
            [ -n "$prompt" ] || continue
            phase_dir="$(dirname "$prompt")"
            if [ -f "$phase_dir/.blocked" ]; then
              has_blocked=true
            fi
            if [ ! -f "$phase_dir/.done" ] && [ ! -f "$phase_dir/.blocked" ]; then
              exists=true
            fi
          done < <(find workspace -name PROMPT.md -type f | sort)
          if find workspace -type f -name .done -print -quit | grep -q .; then
            has_done=true
          fi
          if find workspace -type f -name .blocked -print -quit | grep -q .; then
            has_blocked=true
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "has_done=$has_done" >> "$GITHUB_OUTPUT"
          echo "has_blocked=$has_blocked" >> "$GITHUB_OUTPUT"
      - name: Seed continuation phase
        id: seed
        if: steps.phase.outputs.exists != 'true' && steps.phase.outputs.has_done == 'true' && steps.phase.outputs.has_blocked != 'true'
        run: |
          set -euo pipefail
          continuation_dir="workspace/continuation/next"
          if [ -f "$continuation_dir/PROMPT.md" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$continuation_dir"
          cat > "$continuation_dir/PROMPT.md" <<'EOF'
          Continue the novel from the last completed phase. Read NOVEL_SPEC.md, the series outline and ending, the relevant volume outline, state/current.md, the rolling summaries, and the previous 20 chapters. If the current volume is complete, plan the next volume and write its first 10 to 20 chapter batch. Otherwise write the next planned batch. Do not stop at an outline. Update manuscript state files and create exactly one next phase prompt before marking this phase done. Do not edit controller, workflow, agent, or dispatcher files.
          EOF
          git config user.name "novel-fleet-bot"
          git config user.email "novel-fleet-bot@users.noreply.github.com"
          git add "$continuation_dir/PROMPT.md"
          git commit -m "novel: seed continuation phase"
          git push origin HEAD:main
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Re-dispatch next tick
        if: steps.phase.outputs.exists == 'true' || steps.seed.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 30
          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=novel_tick \
            -f "client_payload[phase]=auto" \
            -f "client_payload[reason]=retrigger" \
            -f "client_payload[run_id]=${{ github.run_id }}"
